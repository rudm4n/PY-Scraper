[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-scraper"
version = "0.1.0"
description = "Archivia i contenuti dei tuoi abbonamenti Privacy (privacy.com.br) (ispirato a of-scraper)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
privacy-scraper = "privacy_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["privacy_scraper*"]
